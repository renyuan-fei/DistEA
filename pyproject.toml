[project]
name = "distea"
version = "1.0.0"
description = "DistEA: distributed entity alignment for large knowledge graphs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.4",
    "pymetis>=2023.1.1",
    "tqdm>=4.66",
    # build/runtime dependencies of nxmetis (installed from source, see README)
    "decorator>=5.0",
    "six>=1.16",
    # optional gRPC halo-refresh backend (--cache_backend grpc)
    "grpcio>=1.60",
    "protobuf>=4.0",
]

[project.optional-dependencies]
# DGL is only used by optional paths (VBIP scoring, the DGL mini-batch
# sampler). Install it from the DGL wheel server, e.g.
#   pip install dgl -f https://data.dgl.ai/wheels/cu124/repo.html
dgl = ["dgl>=2.1", "pandas>=2.0", "pyyaml>=6.0", "pydantic>=2.0", "packaging>=23.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "grpcio-tools>=1.60"]

[tool.ruff]
line-length = 100
target-version = "py312"
# src/leapgnn is vendored from LeapGNN (the rpc_client modules are generated by protoc).
exclude = [".venv", "src/leapgnn"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
# Math-notation capitals (N, D, E, P, RREA, GCN) follow the papers being ported.
ignore = ["E501", "UP040", "N802", "N803", "N806", "N812"]
